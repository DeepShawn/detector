name: Android APK

on:
  push:
    branches: [ccr-a863c521-x7ur59]
    paths:
      - 'android/**'
      - 'data/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync game data into app assets
        run: |
          mkdir -p android/app/src/main/assets/data
          cp data/*.json android/app/src/main/assets/data/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "temporary=false" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret; generating a temporary keystore (update requires uninstalling old build)."
            keytool -genkeypair -keystore "$KS" -storepass huoyan000 -keypass huoyan000 \
              -alias huoyan -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Huoyan Jinjing, OU=Prototype, O=Fiction, C=US"
            echo "temporary=true" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$KS" >> "$GITHUB_OUTPUT"

      - name: Build release APK (arm64-v8a)
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'huoyan000' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'huoyan' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'huoyan000' }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          cp "$APK" huoyan-jinjing-arm64-v8a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: huoyan-jinjing-arm64-v8a
          path: huoyan-jinjing-arm64-v8a.apk

      - name: Publish to rolling release
        if: github.ref == 'refs/heads/ccr-a863c521-x7ur59'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 火眼金睛 Android（滚动构建）
          body: |
            《火眼金睛》原生安卓 APK（arm64-v8a）。

            - 纯 Kotlin + 原生 View，无内购无广告，全部关卡离线可玩。
            - 若未配置签名密钥（Secrets: KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），
              使用临时调试签名；更新时如提示签名不一致，请先卸载旧版。
            - 本作为虚构黑色喜剧，不采集任何真实系统信息。
          prerelease: true
          files: huoyan-jinjing-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
